name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-apk:
    needs: analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web,android --org com.viril.app .
      # Ensure Gradle plugin resolution checks Maven Central as well as the Plugin Portal.
      - name: Configure Android plugin repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle.kts")
          content = path.read_text()
          start = content.find("pluginManagement {")
          repo = content.find("repositories {", start)
          if start < 0 or repo < 0:
              raise SystemExit("Could not find pluginManagement.repositories in android/settings.gradle.kts")
          insert_at = repo + len("repositories {")
          content = content[:insert_at] + "\n        google()\n        mavenCentral()" + content[insert_at:]
          path.write_text(content)
          PY
      - run: flutter pub get
      - name: Prepare uploaded Viril logo images
        run: |
          python3 -m pip install --quiet --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          # The files uploaded by the user have an extra ".png" in their names.
          # Pillow can still identify their real format from the file contents.
          # Allow recovery of valid image data if the upload has a truncated tail.
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          sources = {
              Path("assets/splash/splash-logo.png .png"): Path("assets/splash/viril-logo.png"),
              Path("assets/app_icon/app-icon.png.png"): Path("assets/app_icon/viril-icon.png"),
          }

          for source_path, target_path in sources.items():
              if not source_path.is_file():
                  raise SystemExit(f"Uploaded user image not found: {source_path}")
              with Image.open(source_path) as source:
                  source.load()
                  image = source.convert("RGBA")
                  if image.width < 64 or image.height < 64:
                      raise SystemExit(f"Image is too small: {source_path} ({image.size})")
                  image.save(target_path, format="PNG", optimize=True)
                  print(f"Prepared {source_path} -> {target_path}: {image.size}")
          PY
      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons
      # Preinstall the NDK required by the generated Android project.
      # Retry transient/partial downloads before Gradle starts the APK build.
      - name: Install Android NDK with retries
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            if "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "ndk;$NDK_VERSION"; then
              exit 0
            fi
            echo "NDK installation attempt $attempt failed."
            rm -rf "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
            sleep 12
          done
          echo "Android NDK installation failed after 3 attempts."
          exit 1
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: viril-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
