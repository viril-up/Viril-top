name: Flutter validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Configure Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permissions = '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          if "android.permission.ACCESS_FINE_LOCATION" not in content:
              content = content.replace("<application", permissions + "<application", 1)
          path.write_text(content)
          PY

      - name: Configure Supabase OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="io.supabase.viril" android:host="login-callback" />
                  </intent-filter>
          '''
          start = content.find("<activity")
          end = content.find("</activity>", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not find MainActivity in AndroidManifest.xml")
          activity = content[start:end]
          if "io.supabase.viril" not in activity:
              content = content[:end] + intent_filter + content[end:]
          path.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build web
        run: flutter build web --release --base-href /Viril-top/

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: viril-top-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
