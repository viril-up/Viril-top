name: viril
description: Viril — система комплексного саморазвития.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  pdfrx: ^2.4.5
  record: ^6.1.2
  audioplayers: ^6.5.0
  geolocator: ^13.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  image_path: assets/app_icon/viril-icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/app_icon/viril-icon.png
  min_sdk_android: 21
flutter:
  uses-material-design: true
  assets:
    - assets/section_cards/global_league/
    - assets/section_cards/library/
    - assets/section_cards/videoteka/
    - assets/section_cards/training/
    - assets/section_cards/audio_library/
    - assets/section_cards/running/
    - assets/section_cards/meditation/
    - assets/section_cards/my_dictionary/
    - assets/profile_cover/
    - assets/leagues/
    - assets/resources/books/
    - assets/resources/book_covers/
    - assets/resources/book_descriptions/
    - assets/resources/catalog/
    - assets/resources/videos/
    - assets/resources/articles/
    - assets/splash/
    - assets/app_icon/
    - assets/audio/
