name: viril
description: Viril — система комплексного саморазвития.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  pdfrx: 1.3.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/profile_cover/
    - assets/resources/books/
    - assets/resources/book_covers/\n    - assets/resources/book_descriptions/
    - assets/resources/catalog/
    - assets/resources/videos/
    - assets/resources/articles/
